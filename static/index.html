<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelAI - Your Intelligent Travel Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --theme-primary: #89CFF0; /* Baby Blue */
            --theme-primary-darker: #77b8d8; /* Slightly darker for hover */
            --theme-secondary: #B0E0E6; /* Powder Blue */
            --theme-accent: #5F9EA0; /* Cadet Blue for accents if needed */
            --theme-background: #f0f8ff; /* AliceBlue - very light */
            --theme-surface: rgba(255, 255, 255, 0.75); /* Semi-transparent white for "glass" */
            --theme-text-primary: #2c3e50; /* Dark Slate Gray/Blue */
            --theme-text-secondary: #566573; /* Lighter Slate Gray */
            --theme-border: rgba(0, 0, 0, 0.08); /* Very subtle border */
            --theme-shadow: rgba(44, 62, 80, 0.1); /* Soft shadow */
            --theme-error: #e74c3c; /* A soft red */
            --theme-error-bg: rgba(231, 76, 60, 0.1);

            /* Spinner color will use theme-primary */
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(170deg, var(--theme-background) 0%, #e6f7ff 100%); /* Subtle gradient */
            color: var(--theme-text-primary);
            line-height: 1.6; 
            min-height: 100vh;
        }

        .container {
            max-width: 850px; 
            margin: 2rem auto;
            padding: 0 1rem; 
        }

        header {
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary)); 
            color: var(--theme-text-primary); /* Darker text for light blue background */
            text-align: center;
            padding: 2rem 1.5rem;
            margin-bottom: 2rem;
            border-radius: 12px; 
            box-shadow: 0 2px 8px var(--theme-shadow);
        }

        header h1 {
            margin: 0;
            font-size: 2rem; 
            font-weight: 600; /* Slightly less bold */
        }
        header p {
            margin-top: 0.4rem;
            font-weight: 300;
            font-size: 0.95rem;
            opacity: 0.85;
        }

        .form-container, .itinerary-container {
            background-color: var(--theme-surface);
            -webkit-backdrop-filter: blur(12px); /* Safari */
            backdrop-filter: blur(12px); 
            border-radius: 16px; /* Softer corners */
            box-shadow: 0 8px 24px var(--theme-shadow); /* More diffused shadow */
            padding: 2.5rem; /* More padding */
            margin-bottom: 2.5rem;
            border: 1px solid var(--theme-border);
            transition: box-shadow 0.3s ease;
        }
        .form-container:hover, .itinerary-container:hover {
            box-shadow: 0 12px 32px var(--theme-shadow);
        }

        form {
            display: grid;
            gap: 1.25rem; 
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label, .interests-label { /* Target legend as well */
            font-weight: 500; /* Medium weight */
            font-size: 0.9rem;
            color: var(--theme-text-secondary);
        }
        .interests-label { /* Specific for legend if needed */
             padding-bottom: 0.2rem;
        }


        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.8rem 1rem; 
            border: 1px solid var(--theme-border);
            border-radius: 8px; /* Softer radius */
            font-size: 0.95rem;
            font-family: inherit;
            background-color: rgba(255, 255, 255, 0.7); /* Slightly transparent inputs */
            color: var(--theme-text-primary);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input[type="text"]::placeholder,
        input[type="number"]::placeholder,
        textarea::placeholder {
            color: var(--theme-text-secondary);
            opacity: 0.8;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--theme-primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--theme-primary) 20%, transparent); /* Subtle focus ring */
            background-color: rgba(255, 255, 255, 0.9);
        }

        *:focus-visible { /* General keyboard focus */
             outline: 2px solid var(--theme-accent);
             outline-offset: 1px;
        }

        .interests-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-top: 0.25rem; 
        }

        .interest-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background-color: transparent; /* Minimal */
            padding: 0.6rem 1rem; 
            border-radius: 20px; /* Pill shape */
            border: 1px solid var(--theme-border);
            transition: border-color 0.2s ease, color 0.2s ease;
            cursor: pointer; 
        }

        .interest-item input[type="checkbox"] {
           width: auto; 
           accent-color: var(--theme-primary);
           cursor: pointer;
           margin-right: 0.2rem;
        }
       .interest-item label { /* Label within interest item */
            font-weight: 400; 
            color: var(--theme-text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .interest-item:has(input:checked) { 
             border-color: var(--theme-primary);
             /* Optional: background-color: color-mix(in srgb, var(--theme-primary) 10%, transparent); */
        }
        .interest-item:hover {
            border-color: color-mix(in srgb, var(--theme-primary) 70%, var(--theme-border));
        }

        /* General Button Styling */
        .button-base {
            border: none;
            padding: 0.85rem 1.75rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 1px 3px var(--theme-shadow);
        }
        .button-base:hover {
            box-shadow: 0 3px 6px var(--theme-shadow);
            transform: translateY(-1px);
        }
        .button-base:active {
             transform: translateY(0px);
             box-shadow: 0 1px 2px var(--theme-shadow);
        }
        .button-base:disabled {
            background-color: #bdc3c7; /* Muted gray */
            color: #7f8c8d;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        button[type="submit"] {
            background-color: var(--theme-primary);
            color: var(--theme-text-primary); /* Darker text on light blue */
        }
        button[type="submit"]:hover {
            background-color: var(--theme-primary-darker);
        }
        
        /* Secondary button style for Copy button (inherits from button-base) */
        .button-secondary {
            background-color: var(--theme-accent); 
            color: white; /* White text on cadet blue */
            font-size: 0.85rem; /* Slightly smaller */
            padding: 0.6rem 1.2rem;
        }
        .button-secondary:hover {
            background-color: color-mix(in srgb, var(--theme-accent) 85%, black);
        }


        #itinerary-output {
            margin-top: 1rem; 
            border-top: 1px solid var(--theme-border);
            padding-top: 1.5rem;
        }

        #itinerary-output h1, /* Should not exist here based on structure */
        #itinerary-output h2, /* For non-collapsible h2 if any */
        #itinerary-output h3 {
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            color: var(--theme-text-primary); /* Main text color for headings */
        }

        #itinerary-output h2.collapsible-heading { 
            font-size: 1.4rem; /* Slightly smaller */
            color: var(--theme-primary); /* Theme color for clickable days */
            cursor: pointer;
            position: relative;
            padding-left: 28px; 
            margin-bottom: 0.4em; 
        }
        #itinerary-output h2.collapsible-heading .toggle-icon {
            position: absolute;
            left: 0px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem; 
            transition: transform 0.2s ease;
            color: var(--theme-primary); /* Icon color */
            -webkit-user-select: none; 
            user-select: none; 
        }
        #itinerary-output h2.collapsible-heading.collapsed .toggle-icon {
            transform: translateY(-50%) rotate(-90deg);
        }
        .day-content {
            padding-left: 28px; 
            overflow: hidden; 
            max-height: 0; 
            transition: max-height 0.3s ease-out; /* Smoother timing */
            margin-bottom: 0.8em; 
            border-left: 2px solid var(--theme-border); /* Subtle guide line */
            margin-left: 10px; /* Align with icon center */
        }
        .day-content.expanded {
             /* max-height set by JS */
        }

        #itinerary-output h3 { /* For subheadings within day content */
            font-size: 1.15rem;
            color: var(--theme-text-secondary);
            margin-top: 1em;
            margin-bottom: 0.4em;
        }
        #itinerary-output p { margin-bottom: 0.8em; font-size: 0.9rem; }
        #itinerary-output ul, #itinerary-output ol { margin-left: 1.2em; margin-bottom: 0.8em; font-size: 0.9rem;}
        #itinerary-output li { margin-bottom: 0.4em; }
        #itinerary-output strong { font-weight: 500; } /* Medium weight for strong */
        #itinerary-output a { 
            color: var(--theme-accent); 
            text-decoration: none; 
            font-weight: 500;
        }
        #itinerary-output a:hover { text-decoration: underline; }
        #itinerary-output code, #itinerary-output pre {
            background-color: color-mix(in srgb, var(--theme-secondary) 15%, transparent); /* Very light blue bg */
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.85em;
            border: 1px solid var(--theme-border);
            color: var(--theme-text-primary);
        }
        #itinerary-output pre {
             padding: 0.8em;
             overflow-x: auto; 
         }

        .loading-container { 
            text-align: center;
            padding: 2rem;
            display: none; 
            color: var(--theme-text-secondary);
        }

        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.05); /* Lighter base */
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border-left-color: var(--theme-primary); /* Use theme color */
            animation: spin 0.8s linear infinite; /* Faster spin */
            margin: 0 auto 1rem; 
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background-color: var(--theme-error-bg);
            color: var(--theme-error);
            border: 1px solid color-mix(in srgb, var(--theme-error) 30%, transparent);
            padding: 1rem;
            border-radius: 8px; /* Consistent radius */
            margin-top: 1.5rem;
            display: none; 
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                margin: 1.5rem auto; /* Adjusted margin */
                padding: 0 0.75rem;
            }
            header { padding: 1.5rem 1rem; margin-bottom: 1.5rem;}
            header h1 { font-size: 1.7rem; }
             .form-container, .itinerary-container { 
                 padding: 1.5rem; 
                 margin-bottom: 1.5rem;
                 border-radius: 12px; /* Slightly smaller radius for mobile */
             }
             form { gap: 1rem; }
             button[type="submit"], .button-secondary { width: 100%; text-align: center; } 
             .interests-container { gap: 0.5rem; }
             .interest-item { padding: 0.5rem 0.9rem; }
             #itinerary-output h2.collapsible-heading { font-size: 1.25rem; padding-left: 24px; }
             .day-content { padding-left: 24px; margin-left: 8px;}
             #itinerary-output h3 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>TravelAI</h1>
        <p>Your Intelligent Travel Planner</p>
    </header>

    <main class="container">
        <section class="form-container" aria-labelledby="form-heading">
            <h2 id="form-heading" style="margin-bottom: 1.5rem; font-weight: 600;">Plan Your Next Adventure</h2>
            <form id="travelForm">
                <div class="form-group">
                    <label for="destination">Destination:</label>
                    <input type="text" id="destination" required placeholder="e.g., Tokyo, Japan">
                </div>

                <div class="form-group">
                    <label for="duration">Duration (days):</label>
                    <input type="number" id="duration" required min="1" placeholder="e.g., 7">
                </div>

                <div class="form-group">
                    <label for="budget">Budget:</label>
                    <input type="text" id="budget" required placeholder="e.g., 2000 USD, Moderate, Luxury">
                </div>

                <div class="form-group">
                    <label for="season">Season/Month:</label>
                    <input type="text" id="season" required placeholder="e.g., Spring, July">
                    <!-- Or use select:
                    <select id="season" required>
                        <option value="" disabled selected>Select a season</option>
                        <option value="spring">Spring</option>
                        <option value="summer">Summer</option>
                        <option value="fall">Fall</option>
                        <option value="winter">Winter</option>
                    </select>
                    -->
                </div>

                <div class="form-group">
                    <label for="pace">Preferred Pace:</label>
                    <select id="pace" required>
                        <option value="" disabled selected>Select your pace</option>
                        <option value="relaxed">Relaxed</option>
                        <option value="moderate">Moderate</option>
                        <option value="fast-paced">Fast-paced</option>
                    </select>
                </div>

                <fieldset class="form-group">
                    <legend class="interests-label">Interests (select at least one):</legend>
                    <div class="interests-container" role="group" aria-labelledby="interests-label">
                        <div class="interest-item">
                            <input type="checkbox" id="cultural" value="cultural sites and history"> <label for="cultural">Cultural/History</label>
                        </div>
                        <div class="interest-item">
                            <input type="checkbox" id="adventure" value="adventure and outdoor activities"> <label for="adventure">Adventure/Outdoors</label>
                        </div>
                        <div class="interest-item">
                            <input type="checkbox" id="relaxation" value="relaxation and wellness"> <label for="relaxation">Relaxation</label>
                        </div>
                        <div class="interest-item">
                            <input type="checkbox" id="food" value="local food and drink experiences"> <label for="food">Food & Drink</label>
                        </div>
                        <div class="interest-item">
                            <input type="checkbox" id="nature" value="nature and wildlife"> <label for="nature">Nature/Wildlife</label>
                        </div>
                        <div class="interest-item">
                           <input type="checkbox" id="nightlife" value="nightlife and entertainment"> <label for="nightlife">Nightlife</label>
                        </div>
                         <div class="interest-item">
                           <input type="checkbox" id="shopping" value="shopping"> <label for="shopping">Shopping</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Additional Notes or Preferences:</label>
                    <textarea id="notes" rows="4" placeholder="e.g., Traveling with family, prefer museums over galleries, must visit X location..."></textarea>
                </div>

                <button type="submit" id="submitButton">Generate Itinerary</button>
            </form>
        </section>

        <!-- Loading Indicator -->
        <div class="loading-container" id="loadingIndicator" role="status" aria-live="polite">
            <div class="spinner"></div>
            Generating your personalized itinerary... Please wait.
        </div>

        <!-- Error Message Area -->
        <div class="error-message" id="errorMessage" role="alert"></div>

        <!-- Itinerary Display Area -->
        <section class="itinerary-container" id="itineraryContainer" style="display: none;" aria-live="polite">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                 <h2 id="itineraryMainHeading" style="margin-bottom: 0;">Your Personalized Itinerary</h2>
                 <button id="copyButton" class="button-secondary" style="display: none;">Copy Itinerary</button>
            </div>
            <div id="itinerary-output"></div>
        </section>

    </main>

    <footer>
        <!-- Optional Footer -->
       <!-- <p style="text-align: center; margin: 2rem 0; font-size: 0.9rem; color: #777;">Powered by TravelAI</p> -->
    </footer>

    <script>
        const travelForm = document.getElementById('travelForm');
        const submitButton = document.getElementById('submitButton');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const itineraryContainer = document.getElementById('itineraryContainer');
        const itineraryOutput = document.getElementById('itinerary-output');
        const errorMessage = document.getElementById('errorMessage');

        // Use relative URL assuming frontend and backend are served from the same origin
        // Or use an environment variable in a real deployment
        const API_ENDPOINT = '/generate_itinerary'; // Changed from absolute URL

        travelForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Basic validation: Check if at least one interest is selected
            const selectedInterests = document.querySelectorAll('input[type="checkbox"]:checked');
            if (selectedInterests.length === 0) {
                 displayError("Please select at least one interest.");
                 return; // Stop form submission
            }


            const formData = {
                destination: document.getElementById('destination').value.trim(),
                duration: document.getElementById('duration').value,
                budget: document.getElementById('budget').value.trim(),
                season: document.getElementById('season').value.trim(),
                pace: document.getElementById('pace').value,
                interests: Array.from(selectedInterests).map(cb => cb.value),
                notes: document.getElementById('notes').value.trim()
            };

            // --- UI Updates: Start Loading ---
            submitButton.disabled = true;
            submitButton.textContent = 'Generating...';
            loadingIndicator.style.display = 'block';
            itineraryContainer.style.display = 'none'; // Hide previous results
            errorMessage.style.display = 'none'; // Hide previous errors
            const copyBtn = document.getElementById('copyButton');
            if(copyBtn) {
                copyBtn.style.display = 'none'; // Hide copy button initially on new request
                copyBtn.textContent = 'Copy Itinerary'; // Reset button text
                copyBtn.disabled = false;
            }


            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                // Check if response is ok (status in the range 200-299)
                if (!response.ok) {
                    // Try to parse error message from backend, otherwise use status text
                    let errorData;
                    try {
                         errorData = await response.json();
                    } catch (parseError) {
                         // Ignore if response is not JSON
                    }
                    const errorMsg = errorData?.error || `HTTP error! Status: ${response.status} ${response.statusText}`;
                    throw new Error(errorMsg);
                }

                const data = await response.json();

                if (data.error) { // Handle application-specific errors if backend sends them this way
                     throw new Error(data.error);
                }

                 // --- UI Updates: Display Results ---
                if (data.itinerary) {
                    rawItineraryMarkdown = data.itinerary; // Store raw markdown
                    itineraryOutput.innerHTML = marked.parse(data.itinerary); 
                    
                    makeSectionsCollapsible(itineraryOutput); 
                    
                    if(copyBtn) copyBtn.style.display = 'inline-block'; // Show copy button

                    itineraryContainer.style.display = 'block';
                    itineraryContainer.scrollIntoView({ behavior: 'smooth' }); 
                } else {
                    rawItineraryMarkdown = ''; 
                    if(copyBtn) copyBtn.style.display = 'none'; 
                    throw new Error("Received empty itinerary from server.");
                }

            } catch (error) {
                console.error("Error generating itinerary:", error);
                displayError(`Failed to generate itinerary: ${error.message}`);
            } finally {
                 // --- UI Updates: End Loading ---
                submitButton.disabled = false;
                submitButton.textContent = 'Generate Itinerary';
                loadingIndicator.style.display = 'none';
            }
        });

        function displayError(message) {
            rawItineraryMarkdown = ''; 
            const copyBtn = document.getElementById('copyButton');
            if(copyBtn) copyBtn.style.display = 'none';

            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
        }

        let rawItineraryMarkdown = ''; // Store raw markdown for copying

        function makeSectionsCollapsible(container) {
            const mainHeading = document.getElementById('itineraryMainHeading');
            const headings = container.querySelectorAll('h2, h3'); // Consider h3 as well for day sub-sections if any

            headings.forEach(heading => {
                // Skip the main itinerary container heading
                if (heading === mainHeading || (heading.id && heading.id === 'itineraryMainHeading')) {
                    return;
                }
                // Heuristic: if it's an H2 and starts with "Day " or an H3.
                const isDayHeading = (heading.tagName === 'H2' && heading.textContent.trim().match(/^Day\s*\d+/i));
                const isPotentialSubHeading = heading.tagName === 'H3'; // H3s are often part of a day's content

                if (!isDayHeading && !isPotentialSubHeading) return; // Only make Day X H2s or H3s collapsible for now

                heading.classList.add('collapsible-heading');
                const icon = document.createElement('span');
                icon.classList.add('toggle-icon');
                icon.textContent = '▶'; // Start collapsed: Pointing right
                heading.insertBefore(icon, heading.firstChild);
                heading.classList.add('collapsed'); // Start collapsed

                const contentWrapper = document.createElement('div');
                contentWrapper.classList.add('day-content');
                // contentWrapper.style.maxHeight = '0'; // Set by CSS

                let currentElement = heading.nextElementSibling;
                while (currentElement && !currentElement.classList.contains('collapsible-heading') && currentElement.tagName !== 'H2') {
                     // Stop if another H2 (likely next day) or another specifically marked collapsible heading
                    contentWrapper.appendChild(currentElement.cloneNode(true));
                    const toRemove = currentElement;
                    currentElement = currentElement.nextElementSibling;
                    toRemove.remove();
                }
                heading.after(contentWrapper);

                heading.addEventListener('click', () => {
                    const isCurrentlyCollapsed = heading.classList.contains('collapsed');
                    if (isCurrentlyCollapsed) {
                        contentWrapper.style.maxHeight = contentWrapper.scrollHeight + 'px';
                        heading.classList.remove('collapsed');
                        icon.textContent = '▼'; // Expanded: Pointing down
                    } else {
                        contentWrapper.style.maxHeight = '0';
                        heading.classList.add('collapsed');
                        icon.textContent = '▶'; // Collapsed: Pointing right
                    }
                });
                 // Trigger reflow for CSS to apply max-height 0 before potential expansion
                void heading.offsetWidth;
            });
        }

        const copyButton = document.getElementById('copyButton');
        if (copyButton) {
            copyButton.addEventListener('click', async () => {
                if (!rawItineraryMarkdown) {
                    // This case should ideally not happen if button is hidden
                    alert("No itinerary content available to copy.");
                    return;
                }
                try {
                    await navigator.clipboard.writeText(rawItineraryMarkdown);
                    copyButton.textContent = 'Copied!';
                    copyButton.disabled = true;
                    setTimeout(() => {
                        copyButton.textContent = 'Copy Itinerary';
                        copyButton.disabled = false;
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                    // Inform user more gracefully
                    const originalText = copyButton.textContent;
                    copyButton.textContent = 'Copy Failed!';
                    setTimeout(() => {
                         copyButton.textContent = originalText;
                    }, 2500);
                }
            });
        }
        // marked.setOptions({ ... }); // Initialize marked if needed
    </script>
</body>
</html>
